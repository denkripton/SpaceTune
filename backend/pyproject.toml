[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic==1.17.2",
    "asyncpg>=0.31.0",
    "bcrypt>=5.0.0",
    "boto3[crt]>=1.42.52",
    "datetime>=6.0",
    "fastapi>=0.128.0",
    "ffmpeg-python>=0.2.0",
    "httpx>=0.28.1",
    "mako==1.3.12",
    "markupsafe==3.0.3",
    "pydantic-settings>=2.14.1",
    "pydantic[email]>=2.12.5",
    "pyjwt>=2.11.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.0.0",
    "python-dotenv>=1.2.1",
    "python-multipart>=0.0.22",
    "sqlalchemy>=2.0.46",
    "structlog>=26.1.0",
    "uvicorn==0.38.0",
]

[dependency-groups]
dev = [
    "pytest-asyncio>=1.0.0",
    "pytest-mock>=3.14.0",
    "respx>=0.21.0",
    "ruff>=0.14.0",
    "pip-audit>=2.9.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = [
    "integration: requires real Postgres",
]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes (unused imports/vars, undefined names)
    "I",    # isort (import sorting/grouping)
    "B",    # flake8-bugbear (common bug patterns, e.g. mutable default args)
    "UP",   # pyupgrade (modern syntax, e.g. X | Y instead of Union[X, Y])
    "S",    # flake8-bandit (security: hardcoded passwords, SQL injection patterns, etc.)
    "C4",   # flake8-comprehensions (unnecessary list()/dict() wrapping)
    "SIM",  # flake8-simplify (redundant conditionals)
]
ignore = [
    "S101",   # assert used -> pytest relies on bare assert, this rule would flag every test
    "B008",   # Depends()/Form()/File() in defaults is FastAPI's DI idiom, not a bug (FastAPI's own docs recommend this pattern)
    "SIM110", # ruff's fix replaces explicit for-loops with any()/all() generator expressions inside a call, which conflicts with this project's "no comprehensions/generators inside function calls" convention
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S105", "S106", "S107",  # hardcoded password/token strings are expected in test fixtures, not real secrets
    "SIM117",                # nested `with patch(...): with pytest.raises(...):` is intentional — separates mock setup from the assertion under test; ruff's auto-merge produces unreadable one-liners here
    "B017",                  # `pytest.raises(Exception)` (blind) is acceptable when asserting a pydantic ValidationError without importing pydantic's internal exception type
]
"migrations/*" = ["E501", "I001"]  # autogenerated alembic files — not worth reformatting generated code
"**/models.py" = ["F821"]          # SQLAlchemy string-based forward refs (Mapped["Profile"]) are resolved at mapper-configuration time across module boundaries; ruff can't see this
"migrations/env.py" = ["F401"]     # model imports here exist for their side effect (registering with Base.metadata for autogenerate), not for direct use
"src/utils/metadata/tags_metadata.py" = ["E501"]  # OpenAPI tag descriptions read better as single unbroken sentences in the generated docs UI

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.format]
skip-magic-trailing-comma = false